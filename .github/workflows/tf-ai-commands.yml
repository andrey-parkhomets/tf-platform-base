name: tf-ai-commands

# The agent runs only when a person asks for it with a comment on the pull request. The whole comment must be one command:
#   agent coverage [modules/<name>]   write or update tests, verify them, commit them to the branch
#   agent check comments              act on unresolved review threads on the agent's test files
#   agent remove <sha>                revert one commit the agent made (a new commit, history is not rewritten)
#
# `issue_comment` always runs the workflow, scripts and agent definition from the DEFAULT branch, so a pull request cannot
# change them. This file decides who may ask for what (`gate`), reverts commits (`remove`, no model) and calls
# reusable-tf-ai-write.yml for the part that writes tests: model, verification without secrets, commit with the App token.
# The secrets live in the environment `tf-ai-agent` (only the default branch can use it). Three secrets, three kinds of job:
#   ANTHROPIC_API_KEY          agent (in reusable-tf-ai-write.yml)   runs the model and Terraform on PR code, cannot write to the repository
#   (none)                     verify (in reusable-tf-ai-write.yml)  runs Terraform on PR code, no secrets
#   AGENT_APP_ID / _PRIVATE_KEY  commit (in reusable-tf-ai-write.yml), remove   push access; they never run Terraform or the model
on:
  issue_comment:
    types: [created]

# Non-commands get a unique group, so chatter never replaces a queued command. Commands on one pull request run in order.
concurrency:
  group: tf-ai-commands-${{ github.event.issue.number }}-${{ startsWith(github.event.comment.body, 'agent ') && 'cmd' || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Who asked for what
    runs-on: ubuntu-24.04
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, 'agent ') && github.event.comment.user.type != 'Bot' }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      command: ${{ steps.final.outputs.command }}
      arg: ${{ steps.parse.outputs.arg }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      matrix: ${{ steps.matrix.outputs.matrix || '[]' }}
      any: ${{ steps.matrix.outputs.any }}
      dirs: ${{ steps.matrix.outputs.dirs }}
      has_threads: ${{ steps.matrix.outputs.has_threads }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      ACTOR: ${{ github.event.comment.user.login }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      # Default branch: the trusted scripts. Never the pull request's copy.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Parse the comment
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if out=$(trusted/.github/scripts/parse-command.sh); then
            echo "$out" >>"$GITHUB_OUTPUT"
          else
            echo "command=" >>"$GITHUB_OUTPUT"; echo "arg=" >>"$GITHUB_OUTPUT"
          fi

      - name: Check the permission of the person who asked
        id: perm
        if: steps.parse.outputs.command != ''
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) echo "ok=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "ok=false" >>"$GITHUB_OUTPUT"
               gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=-1 >/dev/null || true
               echo "::notice::$ACTOR has '$perm' permission; commands need write access." ;;
          esac

      - name: Look at the pull request
        id: pr
        if: steps.perm.outputs.ok == 'true'
        run: |
          say() { gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$1" >/dev/null; }
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          state=$(jq -r .state <<<"$pr")
          same=$(jq -r --arg r "$REPO" '.head.repo.full_name == $r' <<<"$pr")
          ref=$(jq -r .head.ref <<<"$pr")
          {
            echo "head_sha=$(jq -r .head.sha <<<"$pr")"
            echo "head_ref=$ref"
            echo "base_sha=$(jq -r .base.sha <<<"$pr")"
          } >>"$GITHUB_OUTPUT"
          if [ "$state" != open ]; then echo "ok=false" >>"$GITHUB_OUTPUT"; exit 0; fi
          if [ "$same" != true ]; then
            say "The agent does not run on pull requests from forks: it cannot push to them, and their code must not run next to a secret."
            echo "ok=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if ! [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            say "The branch name has characters the agent does not accept."
            echo "ok=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >>"$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true

      - name: Final command
        id: final
        run: |
          if [ "${{ steps.pr.outputs.ok }}" = true ]; then echo "command=${{ steps.parse.outputs.command }}" >>"$GITHUB_OUTPUT"
          else echo "command=" >>"$GITHUB_OUTPUT"; fi

      - name: Check out the pull request (as data)
        if: steps.final.outputs.command == 'coverage' || steps.final.outputs.command == 'check_comments'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the directories
        id: matrix
        if: steps.final.outputs.command == 'coverage' || steps.final.outputs.command == 'check_comments'
        env:
          COMMAND: ${{ steps.final.outputs.command }}
          ARG: ${{ steps.parse.outputs.arg }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          scripts=$GITHUB_WORKSPACE/trusted/.github/scripts
          has_threads=false
          cd pr
          if [ "$COMMAND" = coverage ]; then
            matrix=$(DIRS="$ARG" "$scripts/detect-modules.sh")
          else
            OUT="$RUNNER_TEMP/threads.json" "$scripts/collect-threads.sh" "$REPO" "$PR_NUMBER"
            cp "$RUNNER_TEMP/threads.json" "$GITHUB_WORKSPACE/threads.json"
            dirs=$(jq -r '[.[].path | split("/")[0:2] | join("/")] | unique | join(" ")' "$RUNNER_TEMP/threads.json")
            # An empty DIRS would make detect-modules.sh fall back to the diff, so only call it when there are threads.
            matrix='[]'
            if [ -n "$dirs" ]; then
              matrix=$(DIRS="$dirs" "$scripts/detect-modules.sh")
              has_threads=true
            fi
          fi
          any=$([ "$matrix" = "[]" ] && echo false || echo true)
          {
            echo "matrix=$matrix"
            echo "any=$any"
            echo "dirs=$(jq -r 'map(.dir) | join(",")' <<<"$matrix")"
            echo "has_threads=$has_threads"
          } >>"$GITHUB_OUTPUT"
          jq . <<<"$matrix"
          if [ "$any" = false ]; then
            if [ "$COMMAND" = coverage ]; then
              msg="Nothing to do: this pull request changes no Terraform module or stack that needs tests. Use \`agent coverage modules/<name>\` to ask for a specific directory."
            else
              msg="Nothing to do: there are no unresolved review threads on test files from people with write access."
            fi
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$msg" >/dev/null
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.matrix.outputs.has_threads == 'true'
        with:
          name: threads
          path: threads.json

  # --------------------------------------------------------------------------------------------------------------------
  # Fail early and cheaply when the push credentials are missing, before any model spend. The secrets live in the environment
  # `tf-ai-agent`, which only the default branch can use (docs/secrets-environment.md); this job only tests that they are set.
  creds:
    name: Push credentials
    needs: gate
    if: ${{ needs.gate.outputs.command != '' }}
    runs-on: ubuntu-24.04
    environment: tf-ai-agent
    permissions:
      pull-requests: write
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check that the push credentials exist
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="The agent cannot run: the secrets \`AGENT_APP_ID\` and \`AGENT_APP_PRIVATE_KEY\` (the GitHub App that pushes the agent's commits) are not set in the environment \`tf-ai-agent\`. See SOLUTION.md." >/dev/null
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------------------------------------------------
  # `agent coverage` and `agent check comments`: the writing part lives in reusable-tf-ai-write.yml (reusable), so that any trigger can
  # use the same implementation. Secrets are passed explicitly, one by one.
  write:
    name: Agent
    needs: [gate, creds]
    if: ${{ needs.creds.outputs.ok == 'true' && needs.gate.outputs.any == 'true' && (needs.gate.outputs.command == 'coverage' || needs.gate.outputs.command == 'check_comments') }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-tf-ai-write.yml
    with:
      command: ${{ needs.gate.outputs.command }}
      matrix: ${{ needs.gate.outputs.matrix }}
      head_sha: ${{ needs.gate.outputs.head_sha }}
      base_sha: ${{ needs.gate.outputs.base_sha }}
      head_ref: ${{ needs.gate.outputs.head_ref }}
      pr_number: ${{ format('{0}', github.event.issue.number) }}
      has_threads: ${{ needs.gate.outputs.has_threads }}
      requester: ${{ github.event.comment.user.login }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

  # --------------------------------------------------------------------------------------------------------------------
  # `agent remove <sha>`: no model, no Terraform. Reverts a commit made by the agent, as a new commit.
  remove:
    name: Revert an agent commit
    runs-on: ubuntu-24.04
    needs: [gate, creds]
    if: ${{ needs.creds.outputs.ok == 'true' && needs.gate.outputs.command == 'remove' }}
    environment: tf-ai-agent
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Identity of the app
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          echo "name=${SLUG}[bot]" >>"$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: .agent/trusted
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Revert and push
        env:
          SHA: ${{ needs.gate.outputs.arg }}
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_TOKEN: ${{ github.token }}
        run: |
          say() { GH_TOKEN=$COMMENT_TOKEN gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$1" >/dev/null; }
          if new=$(.agent/trusted/.github/scripts/revert-commit.sh "$SHA" 2>err.txt); then
            git check-ref-format --branch "$HEAD_REF" >/dev/null
            if git push origin "HEAD:refs/heads/$HEAD_REF"; then
              say "Reverted \`${SHA:0:7}\` in \`${new:0:7}\`. The checks on the pull request run on the new commit."
            else
              say "Could not push the revert: the branch moved. Comment the command again."; exit 1
            fi
          else
            say "Did not revert \`${SHA:0:12}\`: $(head -c 300 err.txt | tr -d '\r' | tr '<>@' '   ')"
            exit 1
          fi
