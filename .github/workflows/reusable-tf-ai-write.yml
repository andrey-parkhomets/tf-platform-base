name: reusable-tf-ai-write

# Reusable workflow: the part of the agent that writes tests and commits them. Called by tf-ai-commands.yml (a person asked
# with a comment) and by tf-ai-analysis.yml (the analysis decided tests are needed); other callers can use it the same way.
#
# The caller has already decided WHAT to do (which directories, which command), checked who asked, and resolved the pull
# request. This workflow trusts only those inputs, and re-validates nothing about the people. What it enforces itself:
#   checkov   no secrets   static scan of the PR (data)
#   round1    see reusable-tf-ai-round.yml: the agent (model key) writes test files and never runs Terraform; a job without
#             secrets formats, runs and verifies them; only test paths are accepted
#   round2    one retry, only for the directories whose verification failed: the agent sees the failing log and fixes the tests
#   commit    App token    pushes exactly the verified patch (no model, no Terraform)
#   report    comment      posts the result
# The secrets are declared here and passed by name by the caller (never all at once). A caller job cannot declare an environment, so what it
# passes comes from repository secrets (none exist once they are deleted: empty). The jobs that need a secret (`agent` in the round workflow, `commit`) declare
# the environment `tf-ai-agent`, which only the default branch can use; its secret of the same name takes precedence
# (docs/secrets-environment.md). No job has two of them.
on:
  workflow_call:
    inputs:
      command:
        description: "coverage or check_comments"
        type: string
        required: true
      matrix:
        description: "JSON from detect-modules.sh (never empty: the caller does not call this workflow without work)"
        type: string
        required: true
      head_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      head_ref:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      has_threads:
        description: "true when .agent/threads.json was uploaded as the `threads` artifact"
        type: string
        default: "false"
      requester:
        description: "login of the person who asked, recorded in the commit message"
        type: string
        default: ""
      sarif_artifact:
        description: "name of a Checkov SARIF artifact the caller already produced; empty = scan here"
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: "the model key; the job that reads it declares the environment tf-ai-agent, whose secret of the same name wins"
        required: false
      AGENT_APP_ID:
        required: false
      AGENT_APP_PRIVATE_KEY:
        required: false

permissions: {}

env:
  TF_VERSION: "1.15.1"
  TF_IN_AUTOMATION: "true"
  CODEGRAPH_VERSION: "1.6.2"

jobs:
  # --------------------------------------------------------------------------------------------------------------------
  # Skipped when the caller already scanned and passes the SARIF artifact (tf-ai-analysis), to avoid scanning twice in one run.
  checkov:
    name: Checkov
    if: ${{ inputs.sarif_artifact == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-checkov.yml
    with:
      ref: ${{ inputs.head_sha }}
      artifact_name: checkov

  # --------------------------------------------------------------------------------------------------------------------
  # Round 1: the agent writes, a job without secrets verifies. The agent never runs Terraform (reusable-tf-ai-round.yml).
  round1:
    name: Round 1
    needs: [checkov]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tf-ai-round.yml
    with:
      round: "1"
      command: ${{ inputs.command }}
      matrix: ${{ inputs.matrix }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      pr_number: ${{ inputs.pr_number }}
      has_threads: ${{ inputs.has_threads }}
      sarif_artifact: ${{ inputs.sarif_artifact || 'checkov' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # Round 2, once and only for the directories whose verification failed: the agent sees the failing log and fixes the tests.
  round2:
    name: Round 2 (fix)
    needs: [round1]
    if: ${{ !cancelled() && needs.round1.outputs.any_failed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tf-ai-round.yml
    with:
      round: "2"
      command: ${{ inputs.command }}
      matrix: ${{ needs.round1.outputs.failed_matrix }}
      head_sha: ${{ inputs.head_sha }}
      base_sha: ${{ inputs.base_sha }}
      pr_number: ${{ inputs.pr_number }}
      has_threads: ${{ inputs.has_threads }}
      sarif_artifact: ${{ inputs.sarif_artifact || 'checkov' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # --------------------------------------------------------------------------------------------------------------------
  # Holds the push credentials. Runs no Terraform and no model: it only applies patches that `verify` accepted.
  commit:
    name: Commit the verified tests
    runs-on: ubuntu-24.04
    environment: tf-ai-agent
    needs: [round1, round2]
    if: ${{ !cancelled() && needs.round1.result != 'skipped' }}
    permissions:
      contents: read
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Identity of the app
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          echo "name=${SLUG}[bot]" >>"$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >>"$GITHUB_OUTPUT"
      # The token is kept in .git/config by this checkout so that `git push` works. Nothing from the pull request is executed here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: .agent/trusted
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{verify-r*,tf-tests-r*}"
          path: .agent/dl
        continue-on-error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.has_threads == 'true'
        with:
          name: threads
          path: .agent/threads-dl
      - name: Commit the directories whose tests passed verification
        id: commit
        env:
          MATRIX: ${{ inputs.matrix }}
          COMMAND: ${{ inputs.command }}
          HEAD_REF: ${{ inputs.head_ref }}
          REQUESTER: ${{ inputs.requester }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          scripts=.agent/trusted/.github/scripts
          mode=$([ "$COMMAND" = check_comments ] && echo review || echo coverage)
          echo '[]' >.agent/commits.json
          n=$(jq length <<<"$MATRIX")
          for i in $(seq 0 $((n - 1))); do
            dir=$(jq -r ".[$i].dir" <<<"$MATRIX"); slug=$(jq -r ".[$i].slug" <<<"$MATRIX")
            r=$("$scripts/pick-round.sh" .agent/dl "$slug")
            v=".agent/dl/verify-r$r-$slug/$slug.json"; patch=".agent/dl/verify-r$r-$slug/$slug.patch"; report=".agent/dl/tf-tests-r$r-$slug/report.json"
            if [ "$(jq -r '.ok // false' "$v" 2>/dev/null)" != true ] || [ ! -s "$patch" ]; then
              echo "$dir: nothing to commit (verification did not pass, or no test changes)"; continue
            fi
            decision=$(jq -r '.decision // "updated"' "$report" 2>/dev/null || echo updated)
            case "$decision" in created|updated) ;; *) decision=updated;; esac
            rationale=$(jq -r '.rationale // ""' "$report" 2>/dev/null | head -c 600 | tr -d '\r' | tr '<>' '  ')
            msg=$(mktemp)
            {
              echo "test($dir): $decision tests via agent ($mode)"
              echo
              [ -n "$rationale" ] && { echo "$rationale"; echo; }
              echo "Verified by the workflow before committing: terraform fmt, init, validate, test (round $r)."
              echo "Requested-by: $REQUESTER"
              echo "Agent-Run: $RUN_URL"
            } >"$msg"
            sha=$("$scripts/commit-patch.sh" "$patch" "$msg")
            jq -c --arg dir "$dir" --arg sha "$sha" '. + [{dir: $dir, sha: $sha}]' .agent/commits.json >.agent/commits.tmp && mv .agent/commits.tmp .agent/commits.json
            echo "$dir: committed $sha"
          done
          if [ "$(jq length .agent/commits.json)" -gt 0 ]; then
            git check-ref-format --branch "$HEAD_REF" >/dev/null
            # Plain push, never forced: if the branch moved while the agent worked, this fails and nothing is lost.
            git push origin "HEAD:refs/heads/$HEAD_REF" || {
              echo "::error::The branch moved while the agent was working, so the commits were not pushed. Comment the command again."
              exit 1
            }
            echo "pushed=true" >>"$GITHUB_OUTPUT"
          else
            echo "pushed=false" >>"$GITHUB_OUTPUT"
          fi

      # Reply on the review threads (and resolve those the agent addressed, only when its tests were committed).
      - name: Answer the review threads
        if: ${{ !cancelled() && inputs.command == 'check_comments' && inputs.has_threads == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MATRIX: ${{ inputs.matrix }}
        run: |
          set -euo pipefail
          scripts=.agent/trusted/.github/scripts
          for i in $(seq 0 $(( $(jq length <<<"$MATRIX") - 1 ))); do
            dir=$(jq -r ".[$i].dir" <<<"$MATRIX"); slug=$(jq -r ".[$i].slug" <<<"$MATRIX")
            r=$("$scripts/pick-round.sh" .agent/dl "$slug")
            report=".agent/dl/tf-tests-r$r-$slug/report.json"
            [ -s "$report" ] || continue
            sha=$(jq -r --arg d "$dir" '[.[] | select(.dir == $d)][0].sha // empty' .agent/commits.json)
            if [ -n "$sha" ]; then
              "$scripts/resolve-threads.sh" "$report" .agent/threads-dl/threads.json "$sha"
            else
              # Nothing was committed for this directory: only the replies that need no commit ("declined").
              jq '.threads |= map(select(.outcome == "declined"))' "$report" >.agent/declined.json
              "$scripts/resolve-threads.sh" .agent/declined.json .agent/threads-dl/threads.json "$(git rev-parse HEAD)"
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: commits
          path: .agent/commits.json
          include-hidden-files: true
          if-no-files-found: ignore

  # --------------------------------------------------------------------------------------------------------------------
  report:
    name: Report to the pull request
    runs-on: ubuntu-24.04
    needs: [checkov, round1, round2, commit]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{tf-tests-r*,verify-r*,${{ inputs.sarif_artifact || 'checkov' }},commits}"
          path: dl
        continue-on-error: true
      - name: Render comment
        env:
          MATRIX: ${{ inputs.matrix }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SARIF_ARTIFACT: ${{ inputs.sarif_artifact || 'checkov' }}
        run: |
          mkdir -p .agent/report .agent/verify
          n=$(jq length <<<"$MATRIX")
          for i in $(seq 0 $((n - 1))); do
            [ "$n" -gt 0 ] || break
            slug=$(jq -r ".[$i].slug" <<<"$MATRIX")
            r=$(trusted/.github/scripts/pick-round.sh dl "$slug")
            cp "dl/tf-tests-r$r-$slug/report.json" ".agent/report/$slug.json" 2>/dev/null || true
            cp "dl/verify-r$r-$slug/$slug.json" "dl/verify-r$r-$slug/$slug.log" .agent/verify/ 2>/dev/null || true
            # Round 2 supersedes round 1; keep what round 1 said, so the comment can show that a fix round happened.
            [ "$r" = 2 ] && cp "dl/verify-r1-$slug/$slug.json" ".agent/verify/$slug.round1.json" 2>/dev/null || true
          done
          cp dl/commits/commits.json .agent/commits.json 2>/dev/null || echo '[]' >.agent/commits.json
          f=$(find "dl/$SARIF_ARTIFACT" -name '*.sarif' -print -quit 2>/dev/null || true); [ -n "$f" ] && cp "$f" .agent/checkov.sarif || true
          JOB_RESULTS=$(jq -c 'map_values(.result)' <<<"$JOB_RESULTS")
          export JOB_RESULTS
          trusted/.github/scripts/render-report.sh >.agent/comment.md
          cat .agent/comment.md >>"$GITHUB_STEP_SUMMARY"
      - name: Post the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.agent/comment.md', 'utf8');
            const {owner, repo} = context.repo;
            await github.rest.issues.createComment({owner, repo, issue_number: parseInt(process.env.PR_NUMBER, 10), body});
