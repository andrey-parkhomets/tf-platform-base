name: tf-cache-warm

# Only runs on main. Pull request runs restore these caches and never write them, so a pull request
# cannot plant a provider binary or an index that later runs trust. Provider binaries are still
# checked against the hashes in each .terraform.lock.hcl on every `terraform init`.
# There is no CodeGraph cache on purpose: indexing a module takes about a second, so every job builds its own index from the
# checkout it analyses (nothing stale to trust, nothing to evict).
on:
  push:
    branches: [main]
    paths:
      - "**/.terraform.lock.hcl"
      - "modules/**"
      - "stacks/**"
      - ".pre-commit-config.yaml"
      - ".github/requirements.txt"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

env:
  TF_VERSION: "1.15.1"

jobs:
  warm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # The cache path is part of the cache version: it must be the same string here and in the jobs that restore it
      # (~/.terraform.d/plugin-cache), or every restore misses.
      - name: Download providers into the plugin cache
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for d in modules/* stacks/*; do
            [ -d "$d" ] && terraform -chdir="$d" init -backend=false -input=false -lockfile=readonly >/dev/null
          done
          du -sh "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ runner.arch }}-${{ env.TF_VERSION }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - name: Install the pre-commit hook environments
        run: |
          set -euo pipefail
          python -m pip install -r .github/requirements.txt
          pre-commit install-hooks
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('.pre-commit-config.yaml', '.github/requirements.txt') }}
