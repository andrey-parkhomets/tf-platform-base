name: reusable-checkov

# One Checkov scan, used by every pipeline that needs it (tf-check, tf-ai-analysis, reusable-tf-ai-write), so the action is
# pinned and configured in a single place. Static scan, no secrets, soft fail: the result is information.
# With `base_ref` the base commit is scanned too (a parallel job), so that scope-sarif.sh can tell the findings a pull request
# introduces from the ones already on its base.
# The scan config (.checkov.yaml) comes from the ref that is scanned.
on:
  workflow_call:
    inputs:
      ref:
        description: "commit to scan; empty = the caller's default checkout"
        type: string
        default: ""
      artifact_name:
        description: "name of the SARIF artifact. Two callers in one workflow run need two names"
        type: string
        default: checkov
      base_ref:
        description: "commit to scan as the baseline (the pull request's base); empty = no baseline. Its SARIF is the artifact <artifact_name>-base"
        type: string
        default: ""

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Scan
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: .
          config_file: .checkov.yaml
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          skip_results_upload: true
          download_external_modules: false
          # Private Terraform modules (this repo only uses local ../../modules sources, so this stays off).
          # To scan stacks that call modules from other private repositories, turn downloads on and give
          # the action a token that can read those repositories:
          #
          #   download_external_modules: true
          #   github_pat: ${{ secrets.TF_MODULES_READ_PAT }}   # fine-grained, contents:read on the module repos only
          # and, if the sources are `git::https://github.com/...` URLs, add to this step:
          #   env:
          #     GITHUB_OVERRIDE_URL: true   # makes the action rewrite github.com URLs to carry the token
          #
          # Rules if you enable it: (1) callers must not run this for fork pull requests (a fork must never run next to the
          # token); (2) prefer a short-lived GitHub App token (actions/create-github-app-token) over a long-lived PAT, passed
          # in as a secret of this workflow; (3) `terraform init` in lint/verify/agent fetches the same modules, so those jobs
          # need the same git URL rewrite, and the agent job must NOT get the token (`git config --global
          # url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"` in the lint/verify jobs only);
          # (4) offline `terraform test` cannot fetch modules, so vendor or pin them or mock the module call in the test.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: results.sarif
          if-no-files-found: warn

  scan_base:
    name: Scan base
    if: ${{ inputs.base_ref != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.base_ref }}
          persist-credentials: false
      - name: Scan
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: .
          config_file: .checkov.yaml
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results-base.sarif
          skip_results_upload: true
          download_external_modules: false
          # Same configuration as the scan above (see the notes there).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}-base
          path: results-base.sarif
          if-no-files-found: warn
